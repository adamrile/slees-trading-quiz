<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sofie’s Trade Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9f4f5;--grid:#d1e5e9;--ink:#12304a;--card:#fff;--up:#1b9a74;--upbg:#d6f2e8;--down:#d6455d;--downbg:#fbe0e5;--muted:#52697a;--gold:#3b8fd4}
@media (prefers-color-scheme:dark){:root{--bg:#0b1a22;--grid:#15292f;--ink:#e6f1f2;--card:#12262e;--upbg:#0f3a30;--downbg:#3d1f2a;--muted:#9db3b8}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
main{max-width:620px;margin:0 auto;padding:20px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.streak{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:6px 14px}
h1{font-size:2.1rem;line-height:1.08;margin:32px 0 12px;font-weight:800}
h2.sub{font-size:1.2rem;margin:26px 0 10px}
p{line-height:1.5;color:var(--muted);font-size:1.02rem;margin:8px 0}
.gift{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:16px 18px;margin:16px 0;box-shadow:6px 6px 0 var(--gold)}
.gift p{color:var(--ink);margin:0;line-height:1.65;font-size:1.05rem}
button{font:inherit;font-weight:800;cursor:pointer}
.btn{width:100%;padding:16px;border-radius:14px;border:2px solid var(--ink);background:var(--up);color:#fff;font-size:1.1rem;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.bad{background:var(--down)}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.grp{font-weight:800;font-size:1.05rem;margin:20px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.sec{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:13px 16px;margin-bottom:12px;box-shadow:0 3px 0 var(--ink)}
.sec:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.sec b{font-size:1.05rem}
.sec span{display:block;font-weight:400;color:var(--muted);font-size:.92rem;margin:2px 0 8px}
.meter{height:9px;background:var(--grid);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--up)}
.bar{height:14px;background:var(--card);border:2px solid var(--ink);border-radius:99px;overflow:hidden;margin:18px 0 8px}
.bar i{display:block;height:100%;background:var(--up);width:0;transition:width .35s}
.tag{font-size:.9rem;color:var(--muted);margin-bottom:20px}
.q{font-size:1.4rem;font-weight:800;line-height:1.28;margin:0 0 20px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:12px;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-bottom-width:4px;border-radius:14px;font-size:1.02rem;font-weight:600}
.opt.sel{background:#e0f0fb;color:#12304a;box-shadow:0 0 0 3px var(--gold)}
.opt.ok{background:var(--upbg);border-color:var(--up);color:var(--ink)}
.opt.no{background:var(--downbg);border-color:var(--down);color:var(--ink)}
.figgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.figgrid .opt{margin:0;padding:8px}
.figopt::before{content:attr(data-l);display:block;font-size:.8rem;font-weight:800;color:var(--muted);margin-bottom:2px}
.figopt svg{display:block}
.foot{margin-top:auto;padding-top:16px}
.fb{border-radius:14px;padding:14px 16px;margin-bottom:14px;line-height:1.45}
.fb.ok{background:var(--upbg);border:2px solid var(--up)}
.fb.no{background:var(--downbg);border:2px solid var(--down)}
.fb b{display:block;font-size:1.1rem;margin-bottom:2px}
.score{font-size:4rem;font-weight:800;margin:26px 0 0}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
 <div class="top"><span id="brand">Daily Trade Practice</span><span class="streak" id="streak">0 day streak</span></div>

 <section id="home">
  <h1 id="hello"></h1>
  <div class="gift"><p id="note"></p></div>
  <p id="status"></p>
  <button class="btn" id="daily">Start today's mix</button>
  <h2 class="sub">Practice by section</h2>
  <div id="secs"></div>
 </section>

 <section id="quiz" class="hide">
  <div class="bar"><i id="prog"></i></div>
  <div class="tag" id="tag"></div>
  <h2 class="q" id="qtext"></h2>
  <div id="opts"></div>
  <div class="foot">
   <div id="fb" class="fb hide"></div>
   <button class="btn" id="check" disabled>Check</button>
  </div>
 </section>

 <section id="done" class="hide">
  <h1>Round complete</h1>
  <div class="score" id="score"></div>
  <p id="doneMsg"></p>
  <div class="foot"><button class="btn" id="back">Back to home</button></div>
 </section>
</main>

<script>
// ===== Personalise this gift here =====
const FRIEND_NAME = "Sofie";
const MESSAGE = "Happy birthday (if you're reading this on 24/10/2026)! I've seen how much time and effort you're putting into learning to trade, so I made you this: a little practice space with short rounds on the exact things you're studying, and a streak, because I've seen how good you are at keeping your Duolingo one going. Some days things will click and some days they won't, and both count. I'm proud of you for sticking with it, and I'm always happy to talk through anything that doesn't make sense yet.";
// ======================================

// Draws a mini candlestick chart. cs = [[open,high,low,close],...] on a 0-100 scale.
// ex.lines = [[y,color,dashed]], ex.boxes = [[firstCandle,lastCandle,yLow,yHigh,color]]
function fig(cs, ex){
 ex = ex || {}; const W=170, H=110, gap=(W-20)/cs.length, y = v => H-6-v*(H-12)/100;
 let o = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" aria-hidden="true">';
 (ex.boxes||[]).forEach(b => { const x0=10+b[0]*gap, x1=10+(b[1]+1)*gap, c=b[4]||"#3b8fd4";
  o += '<rect x="'+x0+'" y="'+y(b[3])+'" width="'+(x1-x0)+'" height="'+(y(b[2])-y(b[3]))+'" fill="'+c+'" fill-opacity=".3" stroke="'+c+'" stroke-width="1.3"/>'; });
 (ex.lines||[]).forEach(l => { o += '<line x1="4" x2="'+(W-4)+'" y1="'+y(l[0])+'" y2="'+y(l[0])+'" stroke="'+(l[1]||"#8a96a3")+'" stroke-width="1" '+(l[2]?'stroke-dasharray="4 3"':'')+'/>'; });
 cs.forEach((c,i) => { const x=10+i*gap+gap/2, col = c[3]>=c[0] ? "#1f9d62" : "#d6455d";
  o += '<line x1="'+x+'" x2="'+x+'" y1="'+y(c[1])+'" y2="'+y(c[2])+'" stroke="'+col+'" stroke-width="1.6"/><rect x="'+(x-5)+'" y="'+y(Math.max(c[0],c[3]))+'" width="10" height="'+Math.max(2,Math.abs(y(c[0])-y(c[3])))+'" fill="'+col+'"/>'; });
 return o + '</svg>';
}

// Each question: [question, [correct answer, wrong, wrong, wrong], explanation]
// To add content, add questions to a section or append a new section object.
const SECTIONS = [
{id:"basics",group:"Market structure",name:"What market structure is",desc:"Why price zigzags and what structure is for",qs:[
["Why does price move in zigzags instead of a straight vertical line?",["Buyers and sellers are both active at all times, so the dominant side only wins overall, not in every moment","Market makers deliberately slow price down","Charts only update every few candles","Only sellers are active during pullbacks"],"In an uptrend there are more buys than sells over the window, but not in every moment. Those moments of extra selling create the pullbacks."],
["What creates the pivot points and zigzag pattern we call market structure?",["Moments when the weaker side briefly gains the upper hand","Random noise with no meaning","Broker spread changes","News events only"],"Pullbacks in an uptrend (and bounces in a downtrend) are moments when the other side briefly dominates."],
["Which of these is NOT a main use of market structure?",["Predicting exact tops and bottoms to the tick","Confirming ranges","Confirming future entry points","Building context"],"Structure is used to confirm ranges, confirm entries and build context, not to call exact ticks."],
["If 100% of the time there were more buys than sells, what would price do?",["Move vertically, leaving nothing to trade","Move in a perfect zigzag","Stay flat","Reverse immediately"],"It is the imbalance not being total that gives price retracements and gives us something to trade."]
]},
{id:"six",group:"Market structure",name:"The six candle rule",desc:"The 2-2-2 rule and inside bars",qs:[
["What does the six candle rule (2-2-2) require for valid uptrend structure?",["2+ bullish closes higher, then 2+ bearish closes lower, then 2+ bullish closes higher","3 bullish candles then 3 bearish candles","Any 6 candles in a row","2 bullish candles then a doji then 2 bearish"],"Expansion, retracement, expansion: at least two consecutive candles in each leg, each trading beyond the previous one."],
["What is the six candle rule sequence in a downtrend?",["2+ bearish closes lower, 2+ bullish closes higher, then 2+ bearish closes lower","2 bullish, 2 bearish, 2 bullish","1 bearish, 1 bullish, 1 bearish","4 bearish candles in a row"],"It mirrors the uptrend: down, up, down, each leg with at least two consecutive candles."],
["What is an inside bar candle?",["A candle whose high and low sit entirely within the other candle's high and low","A candle with no wicks","A candle that opens and closes at the same price","A candle that closes above the previous high"],"If one candle's range is fully inside its neighbour's range, it is an inside bar."],
["Two bearish candles are back to back, but the second is an inside bar. Does this count as 2 consecutive bearish candles?",["No, inside bars do not count towards the rule","Yes, colour is all that matters","Only if it has a long wick","Only on higher time frames"],"Inside bars do not count in the 2-2-2 rule."],
["Your retracement leg has only one bearish candle, even though several bearish candles follow later inside the next move. Is it valid structure?",["No, the two candles must be in the retracement leg itself, so keep extending until it is valid","Yes, later bearish candles make up for it","Yes, as long as the next move is large","Only if volume was high"],"Candles inside the later price action do not count. The retracement leg needs its own two consecutive candles."],
["A move shows no valid structure on the 3-day chart. What can you do?",["Check lower time frames, where the six candle rule may be satisfied","Draw it anyway","Ignore the move entirely","Assume it is a break of structure"],"What looks like one leg on a high time frame can contain valid structure on a lower one."]
]},
{id:"highlow",group:"Market structure",name:"Structure highs and lows",desc:"When a high or low is confirmed",qs:[
["In an uptrend, when is a market structure low confirmed?",["The moment price touches the market structure high","As soon as the low is created","When price closes below it","After three higher highs"],"The low is only confirmed once price comes back and touches the structure high."],
["How do you pick the market structure low in an uptrend?",["Take the lowest point price traded between the high being created and the high being touched again","Take the most recent candle low","Take the first low of the day","Take the lowest close"],"Find the lowest point between the high's creation and the high being touched again."],
["In an uptrend you have a structure high, and price makes a new low and then a new high, but has not touched the old structure high. Does the structure low move up?",["No, it stays until price touches the structure high","Yes, immediately to the new low","Yes, once the new high is made","Only if the new high is higher"],"The structure low only updates once the structure high is touched."],
["In a downtrend, when is a market structure high confirmed?",["The moment price touches the market structure low","When price closes above it","When price makes a lower high","When volume increases"],"It is the mirror of the uptrend rule: the high is confirmed when the structure low is touched."],
["In a downtrend, how do you pick the market structure high?",["The highest point price traded between the low being created and the low being touched","The highest close in the move","The first bounce after the low","The highest volume candle"],"Look at the highest point between the low's creation and it being touched again."],
["Does touching the structure low (to confirm the high in a downtrend) need to be a close?",["No, a touch is enough","Yes, a close is required","Yes, two closes are required","Only on the daily chart"],"Confirming the structure point only needs a touch. A break of structure is what needs a close."]
]},
{id:"bos",group:"Market structure",name:"Break of structure",desc:"BOS, trend shifts and expected order flow",qs:[
["What is a break of structure (BOS)?",["A closing price beyond the market structure high or low","Any wick beyond a high or low","Price touching a high or low","Two candles in the same direction"],"A BOS needs a close beyond the level, not just a touch."],
["What does 'expectational order flow' mean?",["What you expect price to do next","The exact price target","The broker's order book","Past volume data"],"It is a fancy way of saying what you think price will do next."],
["In an uptrend, price closes above the structure high. What is the expected order flow?",["A higher low for a higher high","A lower high for a lower low","A range","A full reversal"],"A bullish break in an uptrend suggests continuation: higher low, then higher high."],
["In an uptrend, price closes below the structure low. What does that indicate?",["A bearish BOS and a shift in trend; expect a lower high for a lower low","A continuation of the uptrend","Just a wick","Nothing until three candles close below"],"Breaking the low in an uptrend shifts the trend, so the expected flow becomes lower high, lower low."],
["In a downtrend, price breaks the structure low with a close. What is the expected order flow?",["A lower high for a lower low","A higher low for a higher high","A trend shift","A range"],"A bearish break in a downtrend suggests continuation."],
["In a downtrend, price closes above the structure high. What does that indicate?",["A bullish BOS and a shift in trend; expect a higher low for a higher high","Continuation of the downtrend","A lower low is coming","A wick"],"Closing above the high in a downtrend flips the expected flow to higher low, higher high."]
]},
{id:"good",group:"Market structure",name:"Good vs bad breaks",desc:"How convincing is the break?",qs:[
["Which two things make a good break of structure?",["Good distance beyond the level, and at least one candle spent above it before retracing","A big wick and high volume","A gap and a doji","Two candles of the same colour"],"A convincing break has distance and at least one candle holding beyond the level."],
["Does the candle that causes the break count as the 'one candle spent above' the structure high?",["No, it does not count","Yes, it is the first one","Only if it is bullish","Only on lower time frames"],"You need at least one candle after the breaking candle to stay above."],
["What does a bad break of structure look like?",["A candle closes beyond the level, and the next candle immediately closes back inside with little distance","A break with several closes above it","A break with a large gap","A break on the weekly chart"],"No distance and an immediate close back inside make it unconvincing."],
["After a bad break in an uptrend, how should you treat the call for a higher low and higher high?",["Be careful and not assume it, since the break is not convincing","Take it with full conviction","Always bet on the opposite","Ignore structure entirely"],"A bad break does not give you strong conviction. Wait for more confirmation."]
]},
{id:"wick",group:"Market structure",name:"Wicks (SFPs)",desc:"Taking a level without closing beyond it",qs:[
["What is a wick (swing failure pattern) in this context?",["Price takes the structure high or low but fails to close beyond it","A candle with a long body","A break with a close","A gap between candles"],"The level is exceeded, but the candle closes back on the other side."],
["Is a wick a break of structure?",["No, they are very different things","Yes, it is a weak break","Yes, if it goes far enough","Only in a downtrend"],"A wick makes the other structure point weak. It is not a BOS."],
["In an uptrend, price wicks the structure high. Which point becomes weak?",["The market structure low","The structure high","Neither","The wick high"],"The low's job is to take out and close above the high. After the wick it failed, so the low is weak and can be taken."],
["In a downtrend, price wicks the structure low. What can happen?",["The structure high becomes weak and price may rotate fully back up to it","A guaranteed continuation","A guaranteed BOS","Nothing changes"],"A failed close below the low makes the high weak."],
["Wick scenario 1 (after wicking the structure high in an uptrend):",["Full rotation back down toward the market structure low","Price closes above the next candle","Price makes a higher low and higher high","Price goes sideways forever"],"One possible outcome is a full rotation down to the structure low."],
["Wick scenario 2: price wicks the high and gets a reaction away, then makes a higher low and higher high. What becomes the new break level?",["The wick high","The old structure low","The high of the day","The midpoint"],"The wick high becomes your structure high, and you cannot call a BOS until price closes above it."],
["Wick scenario 3: the first candle wicks the high but the next candle closes above it. What is the result?",["It is still a break of structure","It is a failed break","It is a range","It is a wick, so no BOS"],"If the very next candle closes above, the break stands."]
]},
{id:"domino",group:"Market structure",name:"Overlapping structure & the domino effect",desc:"High, mid and low time frame structure",qs:[
["Which time frame structure is most important and significant?",["The highest time frame","The lowest time frame","They are equal","The 1-minute"],"The higher the time frame, the more significant the structure."],
["Which three levels of overlapping market structure are commonly used to read a chart?",["High, mid and low time frame structure","Trend, range and breakout","Support, resistance and volume","Daily, weekly and monthly only"],"High, mid and low time frame structure, each nested inside the one above."],
["A move looks like one leg on the daily. What might you see on lower time frames?",["Zigzag structure inside it","Exactly the same single candle","No data","Only range"],"Moves on a high time frame are made of structure on lower time frames."],
["If your high time frame is the 1-hour, which pairing works as the mid and low time frames?",["15-minute (mid) and 3-minute (low)","4-hour and daily","30-minute and 1-hour","5-minute and 1-minute"],"Mid and low time frames are chosen relative to the high one. For a 1-hour high time frame, 15-minute and 3-minute is a typical pairing."],
["What is the domino effect in an uptrend context?",["Breaking low time frame structure back to bullish can lead to the mid time frame high, then breaking that can lead to the high time frame high","One candle causes all time frames to flip","Highs knock over lows on the same chart","Volume decides the next move"],"Break the low time frame structure and price can move to the mid time frame high. Break that, and it can move to the high time frame high."],
["Why does the domino effect keep you out of fake higher lows?",["If the mid and low time frames never break back to bullish, you never long the higher low","It guarantees every long wins","It removes the need for stops","It only works on weekends"],"You wait for confirmation from the lower structure. No confirmation means no trade."],
["What does 'low time frame breaks start the high time frame pivot points' mean?",["High time frame pivots are often triggered by lower time frame breaks, but the high time frame is still the most important","Low time frames matter more","High time frames are ignored","Pivots only form on the 1-minute"],"Lower breaks help you anticipate pivots, while the high time frame remains king."],
["Which situation is a warning sign when using the domino effect?",["The low time frame breaks back to bullish, but breaks back to bearish before the mid time frame breaks","The low time frame breaks bullish and the mid follows","Price gaps up","Volume dries up"],"If the low time frame structure flips back bearish before the mid time frame breaks bullish, price may head lower again."],
["After wicking the high, what suggests a full rotation down?",["Mid time frame structure from the low up breaking back to bearish","Price staying above the wick high","Low time frame structure from the top down breaking bullish","A large green candle"],"Breaking the mid structure from the low up after the wick supports scenario 1."]
]}
,{id:"rwhat",group:"Ranges",name:"What a range is and why it forms",desc:"Sideways price and the buyer/seller balance",qs:[
["What is a range?",["Price moving sideways, also called a consolidation phase","A strong move up or down","A gap between two candles","The distance between a high and a low in a trend"],"Markets can trend up, trend down, or move horizontally. Horizontal movement is a range."],
["Why does price tend to range after an aggressive expansion?",["The market becomes one-sided and needs time to rebalance buyers and sellers","Brokers pause trading","Volume always drops to zero","Candles can only expand a limited amount"],"For every buyer there must be a seller. When the ratio gets too one-sided, price consolidates to rebalance before continuing or reversing."],
["What is the analogy used for ranging after a pump or dump?",["A sprinter who gets tired and needs to refuel","A car with a full tank","A ball bouncing in a box","A wave hitting a wall"],"After sprinting, the market needs to gather energy before going again."],
["What can follow a range?",["Either a continuation or a reversal","Only a continuation","Only a reversal","Always a breakout upward"],"The range rebalances things, and then price can go either way."],
["Why does understanding ranges matter for the TCT schematics?",["The schematics are built around ranges and range deviations","They replace market structure","They only matter on the 1-minute","They predict exact prices"],"Ranges and deviations are the foundation for the TCT schematics."]
]}
,{id:"rpull",group:"Ranges",name:"Pulling and confirming a range",desc:"Direction, equilibrium and validity",qs:[
["You are in an uptrend making higher lows and higher highs. How do you pull the range?",["From top to bottom (high to low)","From bottom to top","From the open to the close","From the equilibrium outward"],"In an uptrend you pull from the high down to the low."],
["You are in a downtrend. How do you pull the range?",["From bottom to top (low to high)","From top to bottom","Using the most recent candle only","You don't pull one in a downtrend"],"In a downtrend you pull from the low up to the high."],
["When is a range confirmed?",["When price moves back and touches the equilibrium (0.5) of the range","As soon as you draw the high and low","When price closes beyond the range high","After two weeks"],"The touch of the equilibrium is the confirmation."],
["What is the equilibrium of a range?",["The 0.5 level between the range high and range low","The 0.3 level","The high of the range","The average of the last five candles"],"The 0.5 fib of the high-to-low range is the equilibrium."],
["Is a confirmed range low in an uptrend automatically a market structure low?",["No, the structure low is only confirmed when price touches the structure high, which comes later","Yes, always at the same time","Yes, but only on the daily","Only if the range was deeper than 50%"],"The range low is confirmed on the equilibrium touch, before the market structure low is confirmed."],
["When is a range valid on a given time frame?",["When the six candle rule applies there: 2 candles up, 2 down, 2 up (or the reverse in a downtrend)","When it has at least 10 candles","When price touches the equilibrium twice","When volume is rising"],"The same 2-2-2 rule used for market structure decides whether a range exists on that time frame."],
["A range keeps deviating its high, and each deviation is smaller than the last, before a rotation down. Where did the range originally start?",["Where the six candle rule and equilibrium touch first applied, with the range then extending to include the deviations","At the highest deviation high","At the final low","At the first candle of the day"],"The original range started at the first valid low and high, then expanded as the deviations came."]
]}
,{id:"rdev",group:"Ranges",name:"Deviations",desc:"Wicks, bad breaks and what to expect",qs:[
["What is a deviation?",["Price exceeds the range high or low but does not break it","Price closes beyond the range high or low","Price ranges for a long time","A candle with no wick"],"The level is exceeded without a real break."],
["Price deviates the range high. What can you expect?",["A reversal towards the range low, or close to it","A move to the next high","Nothing in particular","An immediate break of structure"],"A deviation at the top suggests a rotation back to the bottom of the range."],
["Price deviates the range low. What can you expect?",["A move back up towards the range high, or at least well into the upper section","A continued move down","A flat market","A shift in time frame"],"The mirror of a high deviation: expect a rotation up to the range high or just short of it."],
["Why are wicks the easiest deviations?",["A wick is never a break of structure in the first place","They are always bigger","They have more volume","They only happen at highs"],"If price never closes beyond the level, it never broke structure at all."],
["What is a candle-close deviation?",["A bad break of structure: a close beyond the level, then the next candle closes back inside","A candle with a long body","A wick beyond the range","A gap through the level"],"Bad breaks (no distance, immediate close back inside) fall into the deviation category."],
["A break looks real on the 30-minute chart. Why check the highest time frame the range is valid on?",["On a higher time frame, that same move could just be wicks or a bad break, so a deviation","Higher time frames show more candles","The 30-minute is always wrong","Ranges only exist on the 4-hour"],"Always check the highest time frame the range is valid on, because a break on a lower one can be a deviation on a higher one."],
["How does the time frame change how strict you are with deviations?",["Lower time frame ranges get stricter, expecting quick wicks or immediate returns; higher time frame deviations can be deeper and slower","Lower time frames allow bigger deviations","They are the same","Only higher time frames use deviations"],"Higher time frames move slower and take more time to trap people, so deviations can be deeper. On lower time frames, deviations are expected to be quick and clean."]
]}
,{id:"rdl",group:"Ranges",name:"The deviation limit (DL)",desc:"The 30% rule and how to use it",qs:[
["What is the deviation limit (DL)?",["A limit on how far price can deviate, based on the size of the range","A time limit on deviations","The maximum number of deviations","The range high itself"],"It is a threshold used to tell a deviation from a real range break."],
["What size is the DL set at?",["30% of the range size","50% of the range size","10% of the range size","100% of the range size"],"The range is 100%, and the DL sits 30% of that beyond the high and low."],
["How can you draw the DL with the fib retracement tool?",["Add the 1.3 and -0.3 levels","Add the 0.3 and 0.7 levels","Add the 1.618 and -0.618 levels","Add the 0.5 level only"],"1.3 and -0.3 put the DL 30% above the range high and 30% below the range low."],
["Price breaks the range high but does not close above the DL. What is it?",["Still a deviation","A confirmed break of structure","A new range","A shift in time frame"],"You do not want a close beyond the DL when calling something a deviation."],
["Price deviates the high without closing above the DL and comes back inside. What do you do with the range?",["Extend the range high to the deviation high, which also moves the DL","Delete the range","Pull a new range from the low","Leave it unchanged"],"The range expands to include the deviation high, so the DL (30% of the new size) grows too."],
["The DL overlaps a good-looking demand zone below the range. How do you treat it?",["Picture the DL just below the demand zone","Ignore the demand zone","Use a 50% DL","Treat any close in the zone as a break"],"A close inside a good demand zone can still bounce, so the DL is imagined below it (or above a supply zone)."],
["Why not allow very large deviations?",["When a deviation is too big it looks more like market structure","Large deviations are impossible","Brokers cancel them","They only occur in uptrends"],"A big move beyond the range starts to look like structure, which is why the limit is around 30%."]
]}
,{id:"rnest",group:"Ranges",name:"Ranges within ranges",desc:"Premium, discount and nested ranges",qs:[
["What is premium and discount in a range?",["Above the equilibrium is premium, below it is discount","Premium is the whole range, discount is outside it","Premium is the low, discount is the high","They are only used in trends"],"From the 0.5 up to the range high is premium, and from the 0.5 down to the range low is discount."],
["Price is rotating inside a range. Should you try to draw market structure from the range low up to the high?",["No, watch the most recent expansion instead","Yes, always","Yes, but only on daily","Only in a downtrend"],"Inside a range you do not trend, so you just look at the most recent rotation to see which structure matters."],
["How common are ranges within ranges?",["Almost all the time","Rare","Only on high time frames","Only in crypto"],"Almost every chart has ranges inside ranges, depending on the time frame."],
["Why can one chart have several ranges at once?",["Overlapping market structure, such as high, mid and low time frame structure, gives different ranges","Different indicators","Different brokers","Random chance"],"Each level of structure can give its own range."],
["Inside a high time frame uptrend range, price makes a local downtrend on a lower time frame. How do you pull the local range?",["From bottom to top","From top to bottom","Don't pull one","Use the equilibrium as the anchor"],"A local downtrend means you pull from bottom to top, even though the bigger picture is up."],
["Which range matters more?",["The higher time frame range","The lower time frame range","The smallest one","They are equal"],"The same principle as market structure: higher time frame points are more important."],
["Can price rotate between premium and discount many times before breaking out?",["Yes, many internal rotations without taking the extreme high or low","No, it must break out after one rotation","Only twice","Only on the daily"],"Price can rotate many times inside a range before taking the main extreme."]
]}
,{id:"rgood",group:"Ranges",name:"Good vs bad ranges",desc:"Be rational about what you call a range",qs:[
["A range can be technically valid but not good. What is the lesson?",["Be rational: a range is price going sideways","Always trust the rule over the chart","Only use the highest time frame","Ranges don't need to look horizontal"],"A range is horizontal price action, so the picture has to look like one."],
["What does a V-shaped, sharp move usually look like?",["More like market structure than a range","A perfect range","A deviation","A gap"],"Sharp V shapes tend to be structure. When the V gets very extended and wide, it behaves like a range."],
["What makes a good-looking range?",["Horizontal price action with a wide, extended shape","A tall V","A straight line","Only one candle"],"You want price visibly moving sideways."],
["A high time frame range is V-shaped, while a lower time frame range inside it moves sideways cleanly. Where should most of your attention go?",["The cleaner, sideways lower time frame range","The high time frame V","Neither","The 1-minute chart"],"Both are technically valid, but the rational, clean range gets the attention."],
["In a sharp V-shaped downtrend you wick the low. Why be careful calling that a clean range?",["The SFP can be temporary, and price can come back down if structure breaks instead of fully rotating up","Wicks are always wrong","Ranges can't have wicks","A wick cancels the range"],"After a wick, a rotation isn't guaranteed. A later break of structure can take price back to the SFP."]
]}

,{id:"sdwhat",group:"Supply and demand",name:"What supply and demand are",desc:"Why price reacts when it returns",qs:[
["What does a supply area represent?",["An area where there were significantly more sellers than buyers, causing an expansion down","An area where price moved sideways","A level with high volume only","The highest price of the month"],"Sellers stepped in at a price and pushed it lower. When price returns, we can expect a reaction."],
["Why do we expect a reaction when price returns to a supply or demand area?",["The same participants are expected to protect their positions there","Charts repeat exactly","The broker closes trades","Volume resets"],"The idea is that those who pushed price away will defend their positions when price comes back."],
["What does a demand area represent?",["An area with significantly more buyers than sellers, causing an expansion up","The lowest close of the week","A sideways range","A gap down"],"The mirror of supply: buyers stepped in and drove price higher."],
["What do supply and demand zones give a trader?",["Points of interest (POIs) where a trade could potentially form","Guaranteed entries","A replacement for structure","Exact exit prices"],"They are areas to watch, and you then wait for confirmation."]
]}
,{id:"sdob",group:"Supply and demand",name:"Order blocks and fair value gaps",desc:"The OBIF: order block with inefficiency",qs:[
["What is a bullish order block?",["The last bearish candle before an expansion up that leaves a fair value gap","The first bullish candle of a trend","Any bearish candle in a range","The biggest candle on the chart"],"It is the last down candle before the expansion away, as long as a fair value gap is left."],
["What is a bearish order block?",["The last bullish candle before a bearish expansion that leaves a fair value gap","The last bearish candle in a downtrend","A gap up","A candle with no wick"],"It is the mirror: the last up candle before the expansion down."],
["What is a fair value gap?",["Candle one's high and candle three's low (for a bullish gap) don't touch, leaving only a body candle between","Any gap between sessions","Two candles with overlapping wicks","A candle with a large body"],"It is a three-candle formation where the first and third candles' wicks do not connect, leaving an inefficiency."],
["Is an order block valid without a fair value gap?",["No, the inefficiency is required","Yes, always","Only on the daily","Only in a range"],"No inefficiency, no valid order block. That is why it is called an OBIF (order block with inefficiency)."],
["Which part of the candle is the order block?",["The whole candle including its wicks","The body only","The wick only","The close only"],"You grab the wick low and wick high, whichever candle they belong to."],
["How many candles are needed to confirm an order block?",["Three: the order block candle, the expansion candle, and the candle confirming the gap","One","Two","Six"],"You need the order block candle, the expansion, and the third candle that confirms the fair value gap."],
["Why does adding the fair value gap work so well?",["The market likes to fill inefficiencies, so one tap fills the gap and mitigates supply or demand","Gaps are always filled instantly","Gaps cancel the order block","It makes the zone bigger"],"It combines mitigating a zone and filling an inefficiency in one move."]
]}
,{id:"sdstruct",group:"Supply and demand",name:"Structure supply and demand",desc:"Multi-candle zones and refined areas",qs:[
["What is structure supply or demand?",["A supply or demand area represented by multiple candles","A single candle zone","A zone with no fair value gap","A zone drawn only on weekly charts"],"It is the same idea as an order block but made of several candles."],
["Why is it called structure supply?",["Because it follows structure, like using the whole move up before a lower high and expansion down","Because it needs a structure low","Because it is only drawn at highs","Because it uses indicators"],"It lines up with the structure you are already drawing, such as lower highs and lower lows."],
["Does structure supply and demand still need the fair value gap?",["Yes, the inefficiency rule applies","No","Only for demand","Only on lower time frames"],"The inefficiency rule is used for structure zones too."],
["Where do refined zones come from?",["Overlapping lower time frame structure inside the bigger zone","Random picks","Volume spikes","Using a wider zone"],"Lower time frame structure inside a larger zone lets you draw a more refined area."],
["What is the one exception to the inefficiency rule?",["When it is the only zone nearby and it had a tiny mitigation, you draw it above (supply) or below (demand) the mitigation","When price gaps","On weekends","When the zone is large"],"Only when there is no other zone close by, and the mitigation was tiny."]
]}
,{id:"sdwhere",group:"Supply and demand",name:"Where to look for zones",desc:"Context first, then zones",qs:[
["Should you randomly pull order blocks wherever you see one?",["No, build context first with structure and ranges","Yes, any zone works","Only on the daily","Only when price is trending"],"Context is key. Structure and ranges come first, and zones add detail."],
["What are the three main locations to look for supply and demand?",["Pivot points, supply in the upper (and demand in the lower) section of a range, and supply above or demand below a range for deviations","Highs, lows and the close","Round numbers","Gaps, wicks and volume"],"Pivot points in structure, premium and discount within a range, and beyond the range for deviations."],
["Within a range, where do you preferably look for bullish order blocks or demand?",["The lower (discount) section","The upper (premium) section","Anywhere","Above the range high"],"Demand sits in the discount half, to rotate back up. Supply sits in the premium half."],
["In a downtrend expecting a lower high, where is the pivot point order block?",["At the lower high","At the low","At the range low","At the equilibrium"],"The pivot point order block lines up with the structure you already expected."],
["After an order block is mitigated and price expands away, can you use it again?",["No, but refined areas inside it may still be unmitigated","Yes, it works again","Only on lower time frames","Yes, if it is bigger"],"A mitigated block is not used anymore, but a more refined area can still be fresh."],
["What is extreme supply?",["The last supply remaining before price reaches the range high","The biggest supply on the chart","Supply in the discount","Supply with the most wicks"],"Extreme supply (and extreme demand) loves to give reactions."],
["What is a supply chain?",["One order block creating another order block, and the reaction from the second tends to be strong","A list of all zones","Supply above a range","A chain of mitigated zones"],"The second block in a clean chain often gives a very strong reaction."],
["How do you find zones on the chart?",["Scan through time frames, not fixed ones, looking for blocks with inefficiency","Only use the 4-hour","Only use the 1-minute","Always use the daily"],"Flick through time frames to see where a good zone sits. A higher time frame block that is also unmitigated on a lower one is even better."]
]}
,{id:"lqwhat",group:"Liquidity",name:"What liquidity is",desc:"Stop losses, buy side and sell side",qs:[
["In this context, what does liquidity mostly refer to?",["Where the most stop losses are located","How much cash a trader holds","The number of open charts","The size of a company"],"Clusters of stop losses are where large orders can find the opposite side they need."],
["A trader is long and their stop-loss gets hit. What does it create?",["A sell order, since the position is sold back to the market at a lower price","A buy order","No order","A limit order above price"],"Stops on long trades are sell orders, which is why they sit as sell side liquidity below lows."],
["A trader is short and their stop-loss gets hit. What does it create?",["A buy order, since the position is bought back at a higher price","A sell order","Nothing","A take-profit"],"Stops on short trades are buy orders, which is why they sit as buy side liquidity above highs."],
["Where does buy side liquidity sit?",["Above highs, where short sellers' stop losses are","Below lows","At the equilibrium","At round numbers only"],"Short stops above a high trigger buy orders when taken."],
["Where does sell side liquidity sit?",["Below lows, where long traders' stop losses are","Above highs","Inside the candle body","At the open"],"Long stops below a low trigger sell orders when taken."],
["Why would a large player push price into a cluster of stop losses?",["To get the opposite orders they need to fill a very large position","To hit their own stop","Because charts must touch every high","To reduce volume"],"A huge buy needs an equally huge seller. Triggered stops provide that counterparty."],
["A large player wants to fill a big short position. Which liquidity helps most?",["Buy side liquidity above highs","Sell side liquidity below lows","The equilibrium","Liquidity in the discount"],"Triggered short stops become buy orders, which they can sell into."],
["What does 'markets move from liquidity to liquidity' mean?",["Price tends to travel from one cluster of stops to the next","Price always moves in a straight line","Volume decides direction","Highs must always be broken"],"After taking one pool of stops, the next obvious pool becomes the target."],
["Why can it feel like your stop-loss is a target?",["Stop clusters are the liquidity larger players use, so price is often drawn to them before reversing","Brokers see your stop","Stops move price themselves","It is random"],"Obvious stop locations are exactly what price tends to reach for."]
]}
,{id:"lqwhere",group:"Liquidity",name:"Where the most liquidity sits",desc:"Ranges and trending structure",qs:[
["In a range, where is the most liquidity?",["Above the range high and below the range low","At the equilibrium","In the middle third","Only at the open"],"The range high and low are the clearest invalidation points, so stops cluster just beyond them."],
["In an uptrend, which structure point holds the most liquidity?",["The market structure low","The market structure high","The equilibrium","The open"],"Buyers place stops below the structure low. The high's liquidity is taken on each break."],
["In a downtrend, which structure point holds the most liquidity?",["The market structure high","The market structure low","The equilibrium","The close"],"Short sellers place stops above the structure high, and often trail them."],
["Why do stops cluster beyond structure points?",["Traders entering on breaks put their invalidation beyond the opposite structure point and often trail it","Brokers require it","Indicators put them there","It is a rule of the exchange"],"Sellers and buyers use the obvious level as their invalidation, which stacks stops in the same place."],
["Short sellers in a range typically sell in the upper section. Where does their stop go?",["Above the range high","Below the range low","At the equilibrium","At the open"],"The range high is their most obvious invalidation, making it buy side liquidity."]
]}
,{id:"lqdev",group:"Liquidity",name:"Deviations and liquidity",desc:"Reading takes of the high and low",qs:[
["Price takes the range high within the deviation limit and closes back inside. What does it imply?",["Buy side liquidity was grabbed, which can let large players fill shorts, and price may rotate to the range low","A confirmed breakout","Nothing yet","A new higher range"],"If price is accepted back inside, the next obvious liquidity is the range low."],
["Why can taking the range high add fuel to a drop?",["Traders long the 'break' or higher low get stopped out, adding sell orders to the move","Their stops are buy orders","It reduces selling","It resets the range"],"Stopped-out longs sell, adding to the cascade."],
["An uptrend makes a higher low and a higher high. What should you check before assuming continuation?",["Whether the break stays within the deviation limit, i.e. is it a deviation or a real break","The moon phase","The volume only","The previous day's close"],"A close beyond the limit is a break, while staying within it points to a deviation."],
["In an uptrend, price wicks below the structure low but closes back above. What liquidity was taken?",["Sell side liquidity, which can let large players fill buys and rotate price to the opposite structure point","Buy side liquidity","None","Only supply"],"A wick below the low sweeps long stops, which can be used to fill buys."],
["Price repeatedly takes the range high but never takes the range low. What does that suggest?",["Buy side liquidity has been taken repeatedly, leaving sell side liquidity as the next target","The range is about to break up","Nothing changes","The range low will hold forever"],"With confirmation, price tends to rotate toward the untouched liquidity."],
["What is a useful way to read a break or deviation?",["Ask where the stops are and what a large player would need price to do to fill their position","Follow the last candle colour","Assume the trend continues","Only look at indicators"],"Thinking about who needs what orders helps you avoid being the liquidity."]
]}
,{id:"lqtrend",group:"Liquidity",name:"Trend lines and liquidity curves",desc:"Why common patterns get run",qs:[
["Why do trend lines often fail?",["They are so widely used that stops cluster along them, making them liquidity","They never connect highs","They only work on weekends","Charts ignore lines"],"Because everyone sees them, the stops behind them become a target."],
["Price is making lower highs along a trend line. How should it be viewed?",["As trend line liquidity, with the highs likely to be taken","As a reliable line to short from","As a range","As demand"],"Each lower high has short stops above it, and taking them triggers buy orders."],
["What is a liquidity curve?",["Price trending in a way that the highs or lows get sharper, so they can't be connected with a straight line","A perfectly straight trend","A flat range","A fair value gap"],"The pivots curve up (or down) instead of lining up on a trend line."],
["What extra requirement makes a good liquidity curve in an uptrend?",["No good demand backing each higher low","Large wicks","A gap at every low","High volume"],"You want pure stop losses at the lows, not zones where large players are expected to defend."],
["In a downtrend, what should be absent for a good liquidity curve?",["Supply backing the lower highs","Wicks","Volume","Any gaps"],"The highs should be pure stops, with no supply behind them."],
["Why is demand at the lows unwanted in a liquidity curve?",["Demand suggests large players will protect that area instead of letting the low simply be swept","It makes the curve too smooth","It lowers volume","It causes gaps"],"A zone defended by large players makes the low less likely to be a clean liquidity pool."]
]}
,{id:"lqrtz",group:"Liquidity",name:"Return to zone",desc:"Is the path to the target clear?",qs:[
["What does a good return to zone look like?",["Only liquidity and no opposing supply or demand between your entry and the target","A big supply zone in the way","Many gaps","A tight range"],"With nothing defending the path, the move to the target tends to be easy."],
["You are short and the path down to the range low is only a series of higher lows with no demand. What happens when the first low is taken?",["Stops trigger sell orders and can snowball into a cascade down","Price bounces","Price pauses","Nothing"],"Each triggered stop pushes price into the next stops."],
["For a long toward the range high, what makes the path easier?",["No supply above, just trend line liquidity","A big supply zone just above","A wide spread","A recent gap down"],"Nothing is holding price down, and taking the highs triggers buy orders."],
["After a low is swept, why can the drop be so aggressive?",["Triggered stop losses chain together, rather than new sellers entering","Everyone shorts at once","Volume spikes","The exchange pauses"],"Stops being hit cause the snowball effect."],
["After a sweep of the highs, what does an untouched low represent?",["Sell side liquidity that is the next obvious target","A broken level","A resistance","A gap"],"Markets tend to rotate toward the opposite liquidity."]
]}

const ALL = SECTIONS.flatMap(s => s.qs.map((q,i) => ({id:s.id+i, sec:s.name, q:q[0], opts:q[1], why:q[2], fig:!!q[3]})));
const $ = id => document.getElementById(id);
const today = () => new Date().toISOString().slice(0,10);
const load = () => { try { return JSON.parse(localStorage.getItem("tct") || "{}"); } catch(e){ return {}; } };
const save = () => { try { localStorage.setItem("tct", JSON.stringify(state)); } catch(e){} };
let state = load(); state.got = state.got || {};
let qs = [], i = 0, right = 0, picked = null, answered = false, daily = false;

function seeded(seed){ let a = 0; for (const c of seed) a = (a*31 + c.charCodeAt(0)) >>> 0; return () => (a = (a*1664525 + 1013904223) >>> 0) / 4294967296; }
function shuffle(arr, rand){ const a = arr.slice(); for(let k=a.length-1;k>0;k--){ const j=Math.floor(rand()*(k+1)); [a[k],a[j]]=[a[j],a[k]]; } return a; }
function streakNow(){ const y = new Date(Date.now()-864e5).toISOString().slice(0,10); return (state.last === today() || state.last === y) ? (state.streak||0) : 0; }
function show(id){ ["home","quiz","done"].forEach(s => $(s).classList.toggle("hide", s !== id)); }

function home(){
 $("streak").textContent = streakNow() + " day streak";
 $("hello").textContent = "Hi " + FRIEND_NAME + ", ready when you are"; $("brand").textContent = FRIEND_NAME + "’s trade practice";
 $("note").textContent = MESSAGE;
 const d = state.last === today();
 $("status").textContent = d ? "Today's mix is done. Keep going with a section below, or come back tomorrow for your streak." : "Five questions from across everything you've learned.";
 $("daily").textContent = d ? "Redo today's mix" : "Start today's mix";
 $("secs").innerHTML = "";
 let lastG = "";
 SECTIONS.forEach(s => {
  if (s.group !== lastG) { lastG = s.group; const h = document.createElement("div"); h.className = "grp"; h.textContent = s.group; $("secs").appendChild(h); }
  const n = s.qs.length, g = s.qs.filter((_,k) => state.got[s.id+k]).length;
  const b = document.createElement("button"); b.className = "sec";
  b.innerHTML = "<b></b><span></span><div class='meter'><i></i></div>";
  b.querySelector("b").textContent = s.name;
  b.querySelector("span").textContent = s.desc + " · " + g + " of " + n + " mastered";
  b.querySelector("i").style.width = (g/n*100) + "%";
  b.onclick = () => begin(s.id);
  $("secs").appendChild(b);
 });
 show("home");
}
function begin(sec){
 daily = sec === "daily"; i = 0; right = 0;
 let pool;
 if (daily) pool = shuffle(ALL, seeded(today())).slice(0,5);
 else {
  const list = ALL.filter(q => q.id.startsWith(sec) && !isNaN(q.id.slice(sec.length)));
  const fresh = shuffle(list.filter(q => !state.got[q.id]), Math.random), old = shuffle(list.filter(q => state.got[q.id]), Math.random);
  pool = fresh.concat(old).slice(0,5);
 }
 qs = pool.map(q => ({...q, o: shuffle(q.opts.map((t,k)=>({t,ok:k===0})), Math.random)}));
 show("quiz"); render();
}
function render(){
 const q = qs[i]; picked = null; answered = false;
 $("prog").style.width = (i/qs.length*100) + "%";
 $("tag").textContent = q.sec + " · " + (i+1) + " of " + qs.length;
 $("qtext").textContent = q.q;
 $("fb").className = "fb hide";
 $("check").textContent = "Check"; $("check").className = "btn"; $("check").disabled = true;
 $("opts").innerHTML = ""; $("opts").className = q.fig ? "figgrid" : "";
 q.o.forEach((o,k) => {
  const b = document.createElement("button"); b.className = "opt";
  if (q.fig) { b.innerHTML = o.t; b.classList.add("figopt"); b.setAttribute("aria-label","Option "+(k+1)); b.dataset.l = "Option "+(k+1); } else b.textContent = o.t;
  b.onclick = () => { if(answered) return; picked = k; [...$("opts").children].forEach((c,n)=>c.classList.toggle("sel",n===k)); $("check").disabled = false; };
  $("opts").appendChild(b);
 });
}
function check(){
 const q = qs[i];
 if (answered) { i++; if (i < qs.length) render(); else finish(); return; }
 answered = true;
 const ok = q.o[picked].ok;
 if (ok) { right++; state.got[q.id] = true; } else delete state.got[q.id];
 [...$("opts").children].forEach((c,n) => { c.classList.remove("sel"); if (q.o[n].ok) c.classList.add("ok"); else if (n===picked) c.classList.add("no"); });
 $("fb").className = "fb " + (ok ? "ok" : "no");
 $("fb").innerHTML = "<b>" + (ok ? "Correct" : "Not quite") + "</b>";
 $("fb").appendChild(document.createTextNode(q.why));
 $("prog").style.width = ((i+1)/qs.length*100) + "%";
 $("check").textContent = i === qs.length-1 ? "Finish" : "Continue";
 $("check").className = "btn" + (ok ? "" : " bad");
}
function finish(){
 if (daily && state.last !== today()) { state.streak = streakNow() + 1; state.last = today(); }
 save();
 $("score").textContent = right + " / " + qs.length;
 $("doneMsg").textContent = right === qs.length ? "Perfect round. Sharp." : right >= 3 ? "Solid. Questions you missed will come back around." : "Misses are free here. Run the section again.";
 show("done");
}
$("daily").onclick = () => begin("daily");
$("check").onclick = check;
$("back").onclick = home;
home();
</script>
